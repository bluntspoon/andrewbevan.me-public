  capCall: "Reads are <strong>AP</strong>: a player seeing a rank that's a fraction of a second stale is fine — nobody notices. Writes within one tournament are effectively <strong>CP</strong>: we use a single writer per tournament, so ordering and consistency are local problems, not distributed ones. If the home region dies, we can lose at most a few hundred milliseconds of un-replicated score events (Kafka MirrorMaker is async by default). Switch to sync if a regulator says zero-loss; the cost is added write latency.",

  topologyNotes: [

  deepDive: {
    title: "Single writer per tournament + region failover",
    body: `<p>The hardest thing in distributed systems is two writers fighting over the same piece of state. So we avoid it by design: <strong>each tournament has exactly one writer in the world at any moment.</strong> Every score event for that tournament is routed to that writer.</p>

    <p>The mechanism is just Kafka. We make the partition key the tournament ID. Kafka guarantees that each partition is processed by one consumer at a time, in order. So "single writer per tournament" comes for free — no distributed lock, no leader-elect-per-row.</p>

    <p>This is the same idea I use on Jackpots with Orleans (one grain per pool = one writer per pool). On Orleans the runtime gives you the single-writer property; here, Kafka does. Same invariant, different vehicle. The lesson is: <strong>once you've made each piece of state owned by one writer, ordering and consistency stop being distributed problems.</strong></p>

    <h4>What happens when the home region dies</h4>
    <ol>
      <li>Health checks fail. An orchestrator (using etcd or Consul) elects a new primary in a surviving region.</li>
      <li>The new primary rebuilds Redis from scratch by replaying Kafka from the last checkpoint. This works because each tournament's history is bounded — even a 1M-player tournament replays in tens of seconds.</li>
      <li>WebSocket clients reconnect to the new region; their subscriptions re-establish.</li>
      <li><strong>How much data can we lose?</strong> Whatever Kafka MirrorMaker hadn't replicated yet — typically around 100ms with default async settings. Sync replication is available if a regulator demands zero-loss; the cost is higher write latency.</li>
      <li><strong>How long is the outage?</strong> Leader election takes seconds; Redis replay takes tens of seconds. Comfortably inside a 99.9% SLA.</li>
    </ol>`,
  },

    ["Why not Orleans here too?", "Orleans is great inside one cluster but doesn't have a built-in cross-region coordination story. Kafka partition ownership plus an external leader election (etcd/Consul) is the right tool when single-writer needs to span continents."],
    ["What if Kafka loses a partition?", "Kafka itself replicates partitions inside a cluster (replication factor of 3+ with the in-sync-replica rule), and MirrorMaker replicates cross-region. So the only way to lose a partition is to lose multiple machines and a region simultaneously, which is well outside our SLA."],
    ["A tournament with 1M concurrent players is on one partition. Won't that be too hot?", "Yes, that's a known scaling cliff. The escape hatch is to sub-shard within the tournament: partition by <code>(tournamentId, hash(playerId) % N)</code>, run N writers, and merge the top-N at read time. Adds complexity, so we only do it when a tournament approaches the limit — not by default."],
    ["Why is Postgres asynchronous?", "Redis is the source of truth for ranks at the sub-second level — that's what the player sees. Postgres is the durable audit record. Because we said reads can tolerate a few ms of staleness, we can let Postgres lag without breaking the contract. The outbox pattern still guarantees the row eventually lands."],
    ["What about idempotency under a retry storm?", "Every event carries an <code>EventID</code>. The writer keeps a sliding window of recent IDs (in Redis with a TTL) and rejects duplicates. So a producer that retries a thousand times causes one apply, not a thousand."],
  ],

  walkIn: "Single writer per tournament, enforced by Kafka partition ownership; cross-region durability via MirrorMaker; failover by leader election with Redis rebuild from the log. AP on reads, effectively-CP on writes within a partition.",

{
  id: "jackpot-contribution",
  badge: "Hero domain",
  badgeClass: "heroes",
  title: "Jackpot Contribution Pipeline",
  oneLiner: "Every wager contributes to one or more shared pools in real time, with regulator-grade audit.",
  summary: "1.5B bets/month · second-fresh pool meter · two-phase contribute/claim.",

  prompt: "Design a jackpot-contribution ingestion pipeline. Every wager across many games and operators contributes a percentage to one or more jackpot pools. Display the live pool value within seconds. Some pools span jurisdictions; others must be ring-fenced.",

  functional: [

    "Increase live pool meters in near-real-time",

    "Maintain immutable audit of every contribution",

  ],

  nfrs: [

    ["Contribution latency", "&lt;100ms p99 on critical path", "Sits inside spin latency budget"],
    ["Display freshness", "&lt;2s on the meter", "Player UX"],
    ["Win-to-credit latency", "&lt;200ms p99", "Felt as instant"],
    ["Audit retention", "7 years", "Regulator"],
    ["RPO", "0 on contributions", "Money-equivalent"],
  ],

  outOfScope: ["Game RNG", "Wallet authority", "Win-selection algorithm"],

  capCall: "Contributions are <strong>CP</strong>: a spin is not allowed to start until its contribution is safely written. We treat the contribution as part of the wager itself — same money, same audit trail. The pool meter the player sees is <strong>AP</strong>: a couple of seconds of staleness on the displayed value is fine. Ring-fencing (some pools may not span jurisdictions) is enforced at the gateway, before contributions even reach the engine, so a misconfigured operator can't pollute the pool.",

  entities: `Pool             { id, name, jurisdictionTags[], rtpPct, seed }
PoolMeter        { poolId, currentValue, snapshotTs }
Wager            { id, playerId, gameId, operatorId, amount, ts }
Contribution     { wagerId, poolId, amount, ts }    -- immutable
Claim (event)    { wagerId, poolId, awardedAmount, ts }`,

  apis: [

└──────────────────────────┘    └────────────────────┘`,
  topologyNotes: [

  deepDive: {
    title: "Two-phase contribute / claim, sync on critical path",
    body: `<p>The constraint that drives this design is: <strong>a played spin must always have a recorded contribution.</strong> If we let a spin run before the contribution is safely written, then a crash mid-spin would leave the pool short of money it owes. That's a regulatory problem.</p>

    <p>So we split a wager into two phases:</p>
    <ol>
      <li><strong>PrePlay (contribute):</strong> on the critical path, synchronously, before the spin is allowed to run. SQL Server commits the contribution row with a sync replica, so it's durable in two places. Only after that commits does the spin proceed.</li>
      <li><strong>Claim (on win):</strong> when the game produces a win, a separate sync call awards the pool. The claim references the original wager ID; we verify the contribution exists, snapshot the current pool value, and award it.</li>
    </ol>

    <h4>Why we use an outbox, not a direct Kafka publish</h4>
    <p>The naive design would write to SQL, then publish to Kafka. But what if SQL succeeds and the Kafka publish fails? The contribution is recorded but no downstream service ever hears about it — pool meters and analytics drift. This is the classic <em>dual-write problem</em>.</p>
    <p>The outbox pattern fixes it by writing the contribution row <strong>and</strong> a "to be published" outbox row in the same database transaction. They commit together or not at all. A separate poller reads the outbox and publishes to Kafka, marking each row done. If Kafka is down, the rows pile up and ship later — nothing is lost.</p>

    <h4>Pattern transfer</h4>
    <p>This is the same one-writer-per-entity pattern that runs through Wallet (one writer per account) and Leaderboard (one writer per tournament). An Orleans grain owns the pool's in-memory state; it serialises updates internally, so we never need a distributed lock. The grain periodically snapshots to SQL for durability. Concurrency stays a local problem.</p>`,
  },

  pushbacks: [
    ["What if SQL commits but the spin then fails?", "The contribution is recorded, the spin never happens, no claim fires. The money stays in the pool for a future winner — that's actually fine, because the player wasn't charged for a spin that didn't run (the wallet debit is also tied to the same flow). If we needed strict reversal we'd add a compensating flow, but the default is 'leave it in the pool' because that money is still legitimately part of the prize."],
    ["Why sync to SQL, why not just publish to Kafka and call it done?", "Imagine Kafka is down. Either (a) we block all spins until it's back — that's effectively making it sync anyway, just worse, or (b) we let spins run uncontributed and reconcile later. Option (b) is a regulatory problem because we'd have played spins with no recorded contribution. So we make the durability sync explicitly, and accept the latency."],
    ["What if a single pool gets too hot for one Orleans grain?", "We can split the pool into segments — sub-grains that each handle a slice of the contributions. The meter is the sum of the segments. We'd only do this for pools that approach the limit; default is one grain per pool."],
    ["What happens if a win-claim arrives before the contribution has committed?", "The claim references the wager ID. The engine refuses to award until it can confirm the contribution row exists. So out-of-order arrivals just get a brief rejection and a retry — we own the ordering rule, the operator doesn't."],

    <p>You can fix this with database tricks: <code>SELECT FOR UPDATE</code> serialises by taking a row lock (slow under contention), or optimistic concurrency reads a version number and retries on conflict (better but the caller has to handle retries). Both work, both add complexity, both can still go wrong if you forget them on one code path.</p>

    <p>The cleaner answer is to ensure that <strong>only one piece of code is ever touching one account at a time</strong>. That's what an Orleans grain gives you: there's exactly one grain instance per account, anywhere in the cluster, and it processes its mailbox one message at a time. Two simultaneous debits become two messages in the queue. They're processed sequentially. There's no race because there's no concurrency on this account.</p>

    <h4>Idempotency</h4>
    <p>Every transaction carries a <code>txKey</code> — a UUID the caller generates per intent. The grain remembers <code>(txKey → result)</code> for a retry window (24 hours). If a network blip causes the caller to retry, the grain sees the same key and returns the same answer it gave last time, without re-applying the transaction. So the player gets charged once even if the caller tries five times.</p>

    <h4>What about a VIP whale who hammers one account?</h4>
    <p>The single grain is then the bottleneck. The escape hatch is to split the hot account into "hold" segments — sub-balances that handle independent traffic, periodically merged. We don't do this by default; it's only for accounts that approach the limit. Most accounts are fine on one grain.</p>`,

    <h4>Three tiers</h4>
    <ul>

    <p>The fix is to have someone outside our control witness our state regularly. That's what the public anchor does.</p>

    <h4>How it works in practice</h4>
    <ul>
      <li><strong>At write:</strong> we HMAC each record. This is fast and protects against bit-flips and outside tampering.</li>
      <li><strong>Every hour:</strong> we compute a Merkle tree over all records written that hour. The root is a single hash that summarises everything — change any one record and the root changes.</li>
      <li><strong>After computing each root:</strong> we publish it to an external timestamp service (RFC 3161) or a public blockchain. The external party records "this root existed at time T". Their record is outside our control.</li>
    </ul>

    <h4>What this catches</h4>
    <ul>
      <li><strong>Outside tampering</strong>: the HMAC won't verify. Caught instantly.</li>
      <li><strong>Insider rewrite</strong>: even if someone with our keys re-signs everything, the public anchor still has the original root from time T. When a regulator pulls the record and the proof, the recomputed root won't match the anchor. Caught.</li>
    </ul>

    <h4>Why not just put everything on a blockchain</h4>
    <p>A Merkle tree with public anchoring gives us the same tamper-evidence guarantees as a blockchain, at a tiny fraction of the cost. We're not trying to run a decentralised currency; we're trying to prove "this record existed at this time and hasn't changed". One hash per hour anchored externally does that perfectly. Blockchains add throughput limits, transaction fees, and operational headaches for no extra security in this threat model.</p>

    <h4>Verification cost</h4>
    <p>To verify a single spin: recompute its leaf hash, walk up about 20 sibling hashes (for an hour with a million records), compare the root to the anchor. That's around 20 hash operations and one external lookup — well under a second. The 5-minute SLA is comfortable.</p>`,

    <h4>Replaying a new rule against history</h4>
    <p>This is a question compliance asks all the time: "if we'd had this new rule last quarter, who would it have flagged?" We can't disturb production and we can't wait six weeks for the new rule to gather data.</p>
    <p>The fix is that <strong>the wager stream is already durable in Kafka, indefinitely</strong>. We spin up a fresh Flink job, point it at a Kafka offset from three months ago, run with the new rule, and write the results to a separate output topic. Production is untouched. We compare the new alerts against what we would have done. If the rule looks good, we promote it to the production job (a rolling deployment).</p>
    <p>This is the unsung superpower of putting events in Kafka: any new analysis is just another consumer. We didn't have to design "replay" as a feature; it falls out of the architecture.</p>

    <h4>Why detection and action are separated</h4>
    <p>The detector says "this player scored 0.83 on rule X". The action engine says "given they're in jurisdiction A, it's 11pm, and we already nudged them this week, do nothing". Policy moves more often than detection. If we mixed them, every policy tweak would force a redeploy of the stateful detector — which means resetting Flink state, which is a real operation. Keeping them separate keeps the cost of policy changes low.</p>`,
  },

  pushbacks: [
    ["How big does the state in Flink get?", "Per-player keyed state, backed by RocksDB on local SSD. Tens of GB per Flink instance is routine and fine. The bound is player count multiplied by window depth, which is well-known and predictable."],
    ["What about events that arrive late?", "Flink uses watermarks to track event-time progress, and we configure an allowed-lateness (say, 30 minutes). Anything later than that goes to a side output where a human reviews — better than silently dropping it."],
    ["What if the same player triggers many alerts in an hour?", "We suppress per-player after the first alert in a configurable window (say an hour), and the operator side has its own rate-limit. So a player on a tear gets one alert, not twenty."],
    ["How is PII handled given GDPR?", "We pseudonymise at ingest using a per-jurisdiction key. The pipeline only ever sees pseudonyms. The join to actual PII happens in the operator dashboard, inside the secure jurisdictional region, behind separate auth. The pipeline can run anywhere; the PII can't leave."],
    ["Why Flink and not Spark Structured Streaming?", "Spark micro-batches every few seconds, which adds latency we don't want. Flink processes event-by-event with proper watermark semantics, which fits 'sliding window per player' naturally. Spark is great for batch; Flink is built for this shape."],
  ],

  walkIn: "Kafka partitioned by playerId, Flink keyed-state with sliding windows, scoring is rule + ML, action engine carries the policy. Replay is just another Flink job from a saved offset writing to a side topic.",

  sources: [],
},

const list = document.getElementById("list");
const detail = document.getElementById("detail");
const titleEl = document.getElementById("title");
const backBtn = document.getElementById("backBtn");

function renderList() {
  list.innerHTML = designs.map(d => `
    <div class="list-card" data-id="${d.id}">
      <span class="badge ${d.badgeClass || ''}">${d.badge}</span>
      <h2>${d.title}</h2>
      <div class="summary">${d.summary}</div>
    </div>
  `).join("");
  list.querySelectorAll(".list-card").forEach(el => {
    el.addEventListener("click", () => showDetail(el.dataset.id));
  });
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderApis(apis) {
  return apis.map(a => {
    const verbClass = a.method === "WS" ? "ws" : "verb";
    return `<div><span class="${verbClass}">${a.method.padEnd(5)}</span> ${a.path}${a.note ? ` <span class="note">— ${a.note}</span>` : ""}</div>`;
  }).join("");
}

function showDetail(id) {
  const d = designs.find(x => x.id === id);
  if (!d) return;
  document.body.classList.add("detail");
  titleEl.textContent = d.title;
  window.scrollTo(0, 0);

  let html = `
    <h2>${d.title}</h2>
    <div class="one-liner">${d.oneLiner}</div>

    <section>
      <h3>1 · Prompt</h3>
      <p>${d.prompt}</p>
    </section>

    <section>
      <h3>2 · Functional requirements</h3>
      <ul>${d.functional.map(x => `<li>${x}</li>`).join("")}</ul>
    </section>

    <section>
      <h3>3 · Non-functional requirements</h3>
      <table>
        <thead><tr><th>Quality</th><th>Target</th><th>Rationale</th></tr></thead>
        <tbody>${d.nfrs.map(([k,v,r]) => `<tr><td>${k}</td><td>${v}</td><td>${r}</td></tr>`).join("")}</tbody>
      </table>
    </section>

    <section>
      <h3>4 · Out of scope</h3>
      <ul>${d.outOfScope.map(x => `<li>${x}</li>`).join("")}</ul>
    </section>

    <section>
      <h3>5 · CAP / consistency call</h3>
      <div class="callout">${d.capCall}</div>
    </section>

    <section>
      <h3>6 · Core entities</h3>
      <pre class="diagram">${escapeHtml(d.entities)}</pre>
    </section>

    <section>
      <h3>7 · APIs</h3>
      <div class="api-list">${renderApis(d.apis)}</div>
    </section>

    <section>
      <h3>8 · HLD — Write path</h3>
      <pre class="diagram">${escapeHtml(d.writePath)}</pre>
      <ul>${d.writeNotes.map(x => `<li>${x}</li>`).join("")}</ul>
    </section>

    <section>
      <h3>9 · HLD — Read path</h3>
      <pre class="diagram">${escapeHtml(d.readPath)}</pre>
      <ul>${d.readNotes.map(x => `<li>${x}</li>`).join("")}</ul>
    </section>`;

  if (d.topology) {
    html += `
    <section>
      <h3>10 · Multi-region topology</h3>
      <pre class="diagram">${escapeHtml(d.topology)}</pre>
      <ul>${d.topologyNotes.map(x => `<li>${x}</li>`).join("")}</ul>
    </section>`;
  }

  html += `
    <section>
      <h3>${d.topology ? "11" : "10"} · Deep dive — ${d.deepDive.title}</h3>
      ${d.deepDive.body}
    </section>

    <section>
      <h3>${d.topology ? "12" : "11"} · Likely panel pushbacks</h3>
      <table>
        <thead><tr><th>Question</th><th>Answer</th></tr></thead>
        <tbody>${d.pushbacks.map(([q,a]) => `<tr><td>${q}</td><td>${a}</td></tr>`).join("")}</tbody>
      </table>
    </section>

    <section>
      <h3>${d.topology ? "13" : "12"} · One-sentence walk-in</h3>
      <div class="callout win">${d.walkIn}</div>
    </section>`;

  if (d.sources && d.sources.length) {
    html += `
    <section class="sources">
      <h3>Sources</h3>
      <ul>${d.sources.map(([t,u]) => `<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join("")}</ul>
    </section>`;
  }

  detail.innerHTML = html;
}

function showList() {
  document.body.classList.remove("detail");
  titleEl.textContent = "iGaming Design Examples";
  window.scrollTo(0, 0);
}

backBtn.addEventListener("click", showList);

renderList();
</script>
</body>
</html>
